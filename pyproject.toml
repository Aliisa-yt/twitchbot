[project]
name = "twitchbot"
version = "2026.10"
description = "A Twitch chatbot built with Python, designed to enhance viewer engagement and provide interactive features for Twitch streamers."
authors = [{ name = "Allisa_yt" }]
requires-python = ">=3.14, <3.16"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp==3.14.5",
    "dataclasses-json==0.6.7",
    "deepl==1.32.0",
    "emoji==2.16.0",
    "google-api-python-client-stubs==1.40.0",
    "google-cloud-speech==2.41.0",
    "google-cloud-translate==3.28.0",
    "gTTS==2.5.4",
    "googletrans==4.0.2",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "pywin32==312; platform_system == 'Windows'",
    "pywin32-ctypes==0.2.3; platform_system == 'Windows'",
    "setuptools>=84.2.1",
    "sounddevice==0.5.6",
    "soundfile==0.14.0",
    "twitchio[starlette]==3.3.2",
    "types-cffi==2.1.0.20260827",
    "types-dataclasses-json==0.5.9",
    "types-grpcio==1.84.0.20261021",
    "types-grpcio-status==1.0.0.20260408",
    "types-httplib2==0.32.0.20260720",
    "types-pyasn1==0.6.0.20260724",
    "types-pywin32==312.0.0.20261006; platform_system == 'Windows'",
    "types-PyYAML==6.0.12.20260906",
    "types-requests==2.33.0.20261006",
    "types-setuptools==84.0.0.20261006",
    "typing-inspect==0.9.0",
    "typing_extensions==4.16.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.40.2",
    "coverage>=7.17.0",
    "mypy==2.4.0",
    "mypy_extensions==1.1.0",
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.9",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.0",
    "testfixtures==12.4.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["twitchbot", "setup_tokens"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
src = ["src", "tests"]

# Excluded directories and files
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    ".github",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    ".coveragerc",
]

# Formatter Settings
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # Docstring rules
    "ANN",     # Type annotation rules
    "CPY001",  # Missing copyright notice
    "ERA001",  # Commented-out code
    "T201",    # Print statements
    "FBT003",  # Boolean positional values in function calls
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "RUF001",  # Ambiguous Unicode characters in string literals
    "RUF002",  # Ambiguous Unicode characters in docstrings
    "RUF003",  # Ambiguous Unicode characters in comments
    "RUF100",  # Unused noqa directives
    "E741",    # Ambiguous variable name
    "COM812",  # Missing trailing comma
    "TD002",   # Missing TODO author
    "TD003",   # Missing TODO link
    "FIX002",  # Line contains TODO or FIXME
    "TRY301",  # Abstract raise to an inner function
    "TRY400",  # Use logging.exception instead of logging.error
    "S101",    # Use of assert
    "S105",    # Possible hardcoded password
    "UP036",   # Outdated version block
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
extend-per-file-ignores = { "tests/**/*" = [
    "INP001", # Missing __init__.py in package
    "S106",   # Possible hardcoded password in function call
    "S108",   # Insecure temporary file or directory
    "SLF001", # Private member access
] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
mypy_path = "src"
files = ["src"]
python_version = "3.14"
exclude = ["dic/.*", "tests/.*"]
explicit_package_bases = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = false
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "soundfile.*",
    "sounddevice.*",
    "gtts.*",
    "google.cloud.*",
    "onnxruntime.*",
    "googletrans.*",
]
ignore_missing_imports = true
# follow_untyped_imports = true
# follow_imports = "silent"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning",
    "ignore:coroutine .* was never awaited:RuntimeWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["core", "handlers", "utils", "config", "models"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/site-packages/*",
    "twitchbot.py",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.basedpyright]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "recommended"
# typeCheckingMode = "basic"

# Rule modification settings.
reportAny = "none"
reportExplicitAny = "none"
reportUnusedCallResult = "none"
reportMissingTypeStubs = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnreachable = "none"
reportMissingTypeArgument = "none"
reportUnusedImport = "hint"
reportUnnecessaryIsInstance = "warning"
reportImportCycles = "hint"
reportImplicitStringConcatenation = "warning"
# reportImplicitOverride = "warning"
# reportPrivateLocalImportUsage = "warning"
reportUninitializedInstanceVariable = "warning"
reportConstantRedefinition = "warning"

include = ["src"]
ignore = ["tests", ".venv"]

exclude = [
    "uv.lock",
    "**/.*",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/node_modules/**",
    "**/dist/**",
    "**/build/**",
    "**/data/**",
    "**/dic/**",
    "**/*.egg-info/**",
    "**/htmlcov/**",
]
